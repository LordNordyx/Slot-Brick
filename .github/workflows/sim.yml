# Every pull request and every change to main runs the Brick simulator: the real Brick build,
# drawn offscreen in Docker, driven through brick/sim/scenarios and compared screen by screen
# with brick/sim/golden. The screenshots, and what differs, are kept as the run's artifact.
# Changes to the docs, the changelog and the licences alone change nothing it tests: skipped.
name: Brick simulator

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'licenses/**'
      - 'LICENSE'
      - 'brick/os/NOTICE.txt'
      - 'brick/os/release-note.sh'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'licenses/**'
      - 'LICENSE'
      - 'brick/os/NOTICE.txt'
      - 'brick/os/release-note.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Pinned to commits, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .docker-cache/cargo
            target-sim
          key: sim-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'brick/sim/Dockerfile', 'brick/sim/build-cores.sh', 'vendor/*-src.tar.gz', 'cores/*/*.patch') }}
          restore-keys: sim-

      - name: Unit tests
        run: sh brick/sim.sh unit

      - name: Scenarios
        run: sh brick/sim.sh test

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-screens
          path: target-sim/out
          if-no-files-found: ignore
