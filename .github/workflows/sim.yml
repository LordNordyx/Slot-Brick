# Every pull request runs the Brick simulator (not the merge after it: main only takes pull
# requests, each already run; a release runs it again before it builds): the real Brick build,
# drawn offscreen in Docker, driven through brick/sim/scenarios and compared screen by screen
# with brick/sim/golden. The screenshots, and what differs, are kept as the run's artifact.
# Changes to the docs, the changelog and the licences alone change nothing it tests: skipped.
name: Brick simulator

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'licenses/**'
      - 'LICENSE'
      - 'brick/os/NOTICE.txt'
      - 'brick/os/release-note.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests and the scenarios, side by side: each builds Slot its own way (the tests
  # with Slot's test code in, the scenarios the program itself), so neither waits for the other.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pinned to commits, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .docker-cache/cargo
            target-sim
          key: sim-unit-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'brick/sim/Dockerfile', 'brick/sim/build-cores.sh', 'vendor/*-src.tar.gz', 'cores/*/*.patch') }}
          restore-keys: sim-unit-

      - name: Unit tests
        run: sh brick/sim.sh unit

  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .docker-cache/cargo
            target-sim
          key: sim-scenarios-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'brick/sim/Dockerfile', 'brick/sim/build-cores.sh', 'vendor/*-src.tar.gz', 'cores/*/*.patch') }}
          restore-keys: sim-scenarios-

      # Two at a time: a GitHub runner's four cores, shared, hold two games at full speed. A
      # scenario snaps only once what it shows has settled, so how fast it runs does not matter.
      - name: Scenarios
        env:
          JOBS: 2
        run: sh brick/sim.sh test

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-screens
          path: target-sim/out
          if-no-files-found: ignore
